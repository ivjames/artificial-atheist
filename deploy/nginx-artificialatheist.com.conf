# Nginx server block for artificialatheist.com
# The whole site is now ONE Next.js app (publication + AtheismIQ quiz + debate
# chat + credits + article review) running on 127.0.0.1:8060. nginx is a thin
# TLS-terminating reverse proxy in front of it — there is no longer a static
# `_site` root or a path-based split between two backends.
#
#   Location: /etc/nginx/sites-available/artificialatheist.com
#   Enable:   ln -s /etc/nginx/sites-available/artificialatheist.com /etc/nginx/sites-enabled/
#   Validate: sudo nginx -t   |   Reload: sudo systemctl reload nginx

upstream nextjs_backend {
  server 127.0.0.1:8060;
}

# WebSocket Connection header: "upgrade" for ws requests, "" (close) otherwise.
map $http_upgrade $aa_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name artificialatheist.com www.artificialatheist.com;
  return 301 https://artificialatheist.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.artificialatheist.com;

  ssl_certificate /etc/letsencrypt/live/artificialatheist.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artificialatheist.com/privkey.pem;

  # Redirect www → non-www canonical
  return 301 https://artificialatheist.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name artificialatheist.com;

  ssl_certificate /etc/letsencrypt/live/artificialatheist.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/artificialatheist.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Next serves its own static assets under /_next; let it set long cache TTLs.
  client_max_body_size 2m;

  # === Everything proxies to the Next app ===
  location / {
    proxy_pass http://nextjs_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Region gate (GDPR sidestep). The app reads the visitor country ONLY from
    # this header and treats client-supplied values as untrusted, so nginx must
    # OVERWRITE it (and thereby strip any spoofed copy a visitor sends). We set
    # it to "" by default: that strips the client header AND makes the gate fail
    # CLOSED (empty → unknown → blocked), so a visitor can't send
    # `X-Country-Code: US` to bypass the gate even before GeoIP2 is installed.
    # AFTER installing GeoIP2 (deploy/nginx-geoip2.conf), replace "" with
    # $geoip2_country_code and `nginx -t && systemctl reload nginx`. Kept as a
    # literal "" (not $geoip2_country_code) here so the vhost loads before the
    # GeoIP2 block exists — an undefined variable would fail `nginx -t`.
    proxy_set_header X-Country-Code "";

    # WebSocket upgrade (harmless for plain HTTP requests)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aa_connection_upgrade;

    proxy_read_timeout 300s;
  }

  # NOTE ON /admin: the standalone Artificial Atheist admin dashboard
  # (tools/admin, basic-auth) is a SEPARATE node process. If you still run it,
  # add a `location /admin { proxy_pass http://127.0.0.1:<its-port>; ... }`
  # block ABOVE the `location /` block so it isn't swallowed by the app. The
  # Next-side article-review queue lives at /review (no collision).
}
